<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10191b"><title>Entre Besos Control</title><style>*{box-sizing:border-box}body{margin:0;background:#10191b;color:white;font:15px system-ui}header{padding:16px 20px;background:#111b1e;font-family:Georgia;font-size:21px;letter-spacing:2px;border-bottom:1px solid #334044;position:sticky;top:0;z-index:2;text-align:center}small{color:#c8a4b4}main{padding:16px 16px 95px;max-width:720px;margin:auto}h1{font-size:23px}.card{padding:16px;margin:10px 0;background:#1b292d;border-radius:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid .card{margin:0}b.num{display:block;font-size:27px;margin-top:8px}.prod{padding:17px;background:#fff8fb;color:#15191c;border-radius:12px;margin:9px 0;border-left:8px solid var(--c)}button{border:0;background:#e5007d;border-radius:10px;padding:12px;color:white;font-weight:700;margin:3px}nav{position:fixed;bottom:0;display:flex;overflow:auto;width:100%;background:#1b292c;padding:8px}nav button{background:none;color:#eee;min-width:82px;font-size:12px}nav button:hover{color:#ff35a3}.prod{box-shadow:0 5px 20px #0003}.card{box-shadow:0 4px 15px #0002}button:active{transform:scale(.98)}input,select{width:100%;font-size:16px;background:#111b1e;color:white;border:1px solid #536367;border-radius:8px;padding:12px;margin:6px 0 14px}label{display:block;color:#c6d0d0;font-size:13px}.muted{color:#b2c1c2;font-size:13px}.tabs{display:flex;gap:7px;overflow:auto}.tabs button{white-space:nowrap}.note{background:#364347;border-radius:10px;padding:12px;font-size:12px}</style><header>ENTRE BESOS <small style="display:block;font:10px system-ui;letter-spacing:2px">MEZCAL ARTESANAL · CONTROL</small></header><main id="app"></main><nav id="nav"></nav><script>
const P=[['Espadín Capón','#e5007d'],['Cupreata','#5550c8'],['Dark Blend','#8a5535']],L=['Oaxaca','CDMX','USA','Singapur'];let D=JSON.parse(localStorage.getItem('eb-v1')||'{"moves":[],"lots":[],"contacts":[],"costs":{}}'),page='Inicio',loc='Oaxaca';const save=()=>localStorage.setItem('eb-v1',JSON.stringify(D)),el=id=>document.getElementById(id),q=(l,p,t)=>D.moves.filter(x=>x.l===l&&(p===undefined||x.p===p)&&(!t||x.t===t)).reduce((a,x)=>a+x.n,0),money=n=>Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'}),opts=a=>a.map(x=>'<option>'+x+'</option>').join('');function go(s){page=s;render()}function selectWarehouse(s){loc=s;render()}function render(){let tabs=['Inicio','Productos','Inventario','Movimientos','Precios','CRM'];el('nav').innerHTML=tabs.map(t=>'<button onclick="go(\''+t+'\')">'+t+'</button>').join('');let h='<p class="muted">SAGAV CUATRO · ADMINISTRACIÓN</p><h1>'+page+'</h1>';if(page==='Inicio')h+='<p class="muted">Información capturada · sin datos ficticios</p><div class="grid">'+L.map(l=>'<div class="card">'+l+'<b class="num">'+q(l)+'</b><small>botellas</small></div>').join('')+'</div><h2>Variedades</h2>'+P.map((p,i)=>'<div class="prod" style="--c:'+p[1]+'"><b>'+p[0]+'</b><p>'+L.reduce((a,l)=>a+q(l,i),0)+' botellas · '+(i===2?'700':'720')+' ml</p></div>').join('')+'<p class="note">Prototipo: datos almacenados únicamente en este teléfono y navegador.</p><div class="card"><h2>Acciones rápidas</h2><button onclick="go(\'Movimientos\')">+ Registrar inventario</button> <button onclick="go(\'Productos\')">Editar costos</button> <button onclick="go(\'CRM\')">+ Prospecto</button></div>';if(page==='Productos')h+='<p class="muted">Toca Editar costo para modificar cada producto.</p>'+P.map((p,i)=>'<div class="prod" style="--c:'+p[1]+'"><b>'+p[0]+'</b><p>Presentación '+(i===2?'700':'720')+' ml · Costo directo: '+money(D.costs[i])+'</p><button onclick="cost('+i+')">Editar costo</button></div>').join('')+'<div id="edit"></div>';if(page==='Inventario')h+='<div class="tabs">'+L.map(l=>'<button onclick="selectWarehouse(\''+l+'\')">'+l+'</button>').join('')+'</div><div class="grid">'+['Total','Nacional','Exportación','Sin etiquetar'].map(t=>'<div class="card">'+t+'<b class="num">'+q(loc,undefined,t==='Total'?null:t)+'</b></div>').join('')+'</div>'+P.map((p,i)=>'<div class="prod" style="--c:'+p[1]+'"><b>'+p[0]+'</b><p>'+q(loc,i)+' botellas · Nacional '+q(loc,i,'Nacional')+' · Exportación '+q(loc,i,'Exportación')+'</p></div>').join('');if(page==='Movimientos')h+='<div class="card"><h2>Crear lote</h2><label>Código</label><input id="lot" placeholder="EB-2026-001"><label>Variedad</label><select id="lp">'+opts(P.map(p=>p[0]))+'</select><button onclick="addLot()">Guardar lote</button></div><div class="card"><h2>Movimiento</h2><label>Lote</label><select id="ml">'+opts(D.lots.map(x=>x.id))+'</select><label>Ubicación</label><select id="where">'+opts(L)+'</select><label>Etiqueta</label><select id="tag">'+opts(['Nacional','Exportación','Sin etiquetar'])+'</select><label>Tipo</label><select id="kind">'+opts(['Entrada','Salida'])+'</select><label>Botellas</label><input id="count" type="number" min="1"><button onclick="move()">Guardar movimiento</button></div>'+D.moves.slice().reverse().slice(0,15).map(x=>'<div class="card">'+x.l+' · '+P[x.p][0]+' · '+x.t+'<b class="num">'+x.n+'</b></div>').join('');if(page==='Precios')h+='<p class="muted">Simulador preliminar de márgenes; impuestos y logística pendientes de validación.</p><div class="card">'+['Costo base MXN','Margen EB %','Importador %','Distribuidor %','Retail %'].map((s,i)=>'<label>'+s+'</label><input id="price'+i+'" type="number" value="'+[250,30,25,25,30][i]+'">').join('')+'<button onclick="price()">Calcular</button><div id="priceResult"></div></div>';if(page==='CRM')h+='<div class="card">'+['Establecimiento','Contacto','Teléfono o correo','Zona','Próxima acción'].map((s,i)=>'<label>'+s+'</label><input id="c'+i+'" placeholder="'+s+'">').join('')+'<button onclick="contact()">Guardar prospecto</button></div><h2>Contactos</h2>'+D.contacts.map(c=>'<div class="card"><b>'+escapeText(c[0])+'</b><p>'+escapeText(c[3])+' · '+escapeText(c[4])+'</p></div>').join('');el('app').innerHTML=h}function escapeText(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function addLot(){let id=el('lot').value.trim();if(!id||D.lots.some(x=>x.id===id))return alert('Código vacío o duplicado');D.lots.push({id,p:P.findIndex(p=>p[0]===el('lp').value)});save();render()}function move(){let lot=D.lots.find(x=>x.id===el('ml').value),n=Number(el('count').value),l=el('where').value,t=el('tag').value;if(!lot||!Number.isInteger(n)||n<=0)return alert('Revisa lote y cantidad');if(el('kind').value==='Salida'){if(q(l,lot.p,t)<n)return alert('Inventario insuficiente');n=-n}D.moves.push({l,p:lot.p,t,n,lot:lot.id});save();render()}function cost(i){let d=D.breakdown?.[i]||{};let fields=['Líquido por litro','Presentación (ml)','Botella','Corcho','Etiqueta','Corrugado por caja','Botellas por caja','Termoencogible','Marbete','Precintos'];el('edit').innerHTML='<div class="card"><h2>Editar '+P[i][0]+'</h2>'+fields.map((f,j)=>'<label>'+f+'</label><input type="number" min="0" step="0.01" id="part'+j+'" value="'+(d[j]??([0,i===2?700:720,0,0,0,0,6,0,0,0][j]))+'">').join('')+'<button onclick="saveCost('+i+')">Guardar desglose</button></div>';el('edit').scrollIntoView({behavior:'smooth',block:'start'})}function saveCost(i){let v=Array.from({length:10},(_,j)=>Number(el('part'+j).value)||0);if(!v[1]||!v[6])return alert('Revisa presentación y botellas por caja');D.breakdown=D.breakdown||{};D.breakdown[i]=v;D.costs[i]=v[0]*v[1]/1000+v[2]+v[3]+v[4]+v[5]/v[6]+v[7]+v[8]+v[9];save();render();alert('Costos guardados')}function price(){let n=Number(el('price0').value);for(let i=1;i<5;i++){let m=Number(el('price'+i).value);if(m<0||m>=100)return alert('Margen inválido');n/=1-m/100}el('priceResult').innerHTML='<h2>Precio ilustrativo: '+money(n)+'</h2>'}function contact(){let c=Array.from({length:5},(_,i)=>el('c'+i).value);if(!c[0])return alert('Captura establecimiento');D.contacts.push(c);save();render()}try{render()}catch(e){document.getElementById('app').innerHTML='<h2>Error de carga</h2><p>'+String(e.message)+'</p>';console.error(e)}
</script></html>
