mber.isFinite(liquid)||liquid<0||v.some(x=>!Number.isFinite(x)||x<0))return alert('Los costos deben ser números no negativos');if(bottles*ml>liters*1000+0.001)return alert('Las botellas exceden los litros declarados');let direct=v.slice(0,6).reduce((a,x)=>a+x,0)+v[7],pack=v[6]/boxSize+v[12]/palletSize,allocated=v.slice(8,12).reduce((a,x)=>a+x,0)/bottles;let totalCost=liters*liquid+bottles*(direct+pack+allocated);D.lots.push({id,p,date:el('newLotDate').value,liters,ml,bottles,liquid,components:v,boxSize,palletSize,totalCost,unitCost:totalCost/bottles,costingVersion:2});save();render();alert('Lote guardado. El costo por botella incluye los litros consumidos y los costos asignados. Registra la entrada física en Movimientos.')} function addLot(){let id=el('lot').value.trim();if(!id||D.lots.some(x=>x.id===id))return alert('Código vacío o duplicado');D.lots.push({id,p:P.findIndex(p=>p[0]===el('lp').value)});save();render()}function move(){let lot=D.lots.find(x=>x.id===el('ml').value),n=Number(el('count').value),l=el('where').value,t=el('tag').value;if(!lot||!Number.isInteger(n)||n<=0)return alert('Revisa lote y cantidad');if(el('kind').value==='Salida'){let available=D.moves.filter(x=>x.l===l&&x.p===lot.p&&x.t===t&&x.lot===lot.id).reduce((a,x)=>a+x.n,0);if(available<n)return alert('Inventario insuficiente para este lote y etiqueta');n=-n}D.moves.push({l,p:lot.p,t,n,lot:lot.id});save();render()}function cost(i){let d=D.breakdown?.[i]||{};let fields=['Líquido por litro','Presentación (ml)','Botella','Corcho','Etiqueta','Corrugado por caja','Botellas por caja','Termoencogible','Marbete','Precintos'];el('edit').innerHTML='<div class="card"><h2>Editar '+P[i][0]+'</h2>'+fields.map((f,j)=>'<label>'+f+'</label><input type="number" min="0" step="0.01" id="part'+j+'" value="'+(d[j]??([0,i===2?700:720,0,0,0,0,6,0,0,0][j]))+'">').join('')+'<button onclick="saveCost('+i+')">Guardar desglose</button></div>';el('edit').scrollIntoView({behavior:'smooth',block:'start'})}function saveCost(i){let v=Array.from({length:10},(_,j)=>Number(el('part'+j).value)||0);if(!v[1]||!v[6])return alert('Revisa presentación y botellas por caja');D.breakdown=D.breakdown||{};D.breakdown[i]=v;D.costs[i]=v[0]*v[1]/1000+v[2]+v[3]+v[4]+v[5]/v[6]+v[7]+v[8]+v[9];save();render();alert('Costos guardados')}function price(){let n=Number(el('price0').value);for(let i=1;i<5;i++){let m=Number(el('price'+i).value);if(m<0||m>=100)return alert('Margen inválido');n/=1-m/100}el('priceResult').innerHTML='<h2>Precio ilustrativo: '+money(n)+'</h2>'}function addDocument(){let name=el('docName').value.trim(),link=el('docLink').value.trim();if(!name)return alert('Escribe el nombre del documento');if(link&&!/^https:\/\//i.test(link))return alert('Usa un enlace HTTPS válido');D.documents=D.documents||[];D.documents.push({name,type:el('docType').value,product:el('docProduct').value,lot:el('docLot').value.trim(),expiry:el('docExpiry').value,link});save();render()}function removeDocument(i){if(!confirm('¿Eliminar esta ficha documental?'))return;D.documents.splice(i,1);save();render()}function addSale(){let client=el('saleClient').value.trim(),amount=Number(el('saleAmount').value),date=el('saleDate').value;if(!client||!(amount>0)||!date)return alert('Completa cliente, fecha e importe');D.sales=D.sales||[];D.sales.push({client,amount,date,status:el('saleStatus').value,ref:el('saleRef').value.trim()});save();render();alert('Venta registrada')}function contact(){let c=Array.from({length:5},(_,i)=>el('c'+i).value.trim());if(!c[0])return alert('Captura establecimiento');D.contacts.push(c);save();render();alert('Prospecto registrado')}function removeContact(i){if(!confirm('¿Eliminar este prospecto?'))return;D.contacts.splice(i,1);save();render()}function editContact(i){let c=D.contacts[i];let name=prompt('Establecimiento',c[0]);if(name===null)return;if(!name.trim())return alert('Nombre obligatorio');let next=prompt('Próxima acción',c[4]||'');if(next===null)return;c[0]=name.trim();c[4]=next.trim();save();render()}try{render()}catch(e){document.getElementById('app').innerHTML='<h2>Error de carga</h2><p>'+String(e.message)+'</p>';console.error(e)}
