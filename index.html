const P=[['Espadín Capón','#e5007d'],['Cupreata','#5550c8'],['Dark Blend','#8a5535']],L=['Oaxaca','CDMX','USA','Singapur'];let D=JSON.parse(localStorage.getItem('eb-v1')||'{"moves":[],"lots":[],"contacts":[],"costs":{}}'),page='Inicio',loc='Oaxaca';const save=()=>localStorage.setItem('eb-v1',JSON.stringify(D)),el=id=>document.getElementById(id),q=(l,p,t)=>D.moves.filter(x=>x.l===l&&(p===undefined||x.p===p)&&(!t||x.t===t)).reduce((a,x)=>a+x.n,0),money=n=>Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'}),opts=a=>a.map(x=>'<option>'+x+'</option>').join('');function go(s){page=s;render()}function selectWarehouse(s){loc=s;render()}function render(){let tabs=['Inicio','Productos','Inventario','Movimientos','Precios','CRM','Gastos','Marketing'];el('nav').innerHTML=['Inicio','Productos','Inventario','Movimientos','Más'].map(t=>'<button class="'+(page===t?'on':'')+'" onclick="go(\''+t+'\')"><span>'+({'Inicio':'⌂','Productos':'◈','Inventario':'▣','Movimientos':'⇄','Más':'☷'}[t])+'</span>'+t+'</button>').join('');let h='<div class="hero"><div class="eyebrow">SAGAV CUATRO · ADMINISTRACIÓN</div><h1>'+page+'</h1><div class="sub">ENTRE BESOS CONTROL</div></div>';if(page==='Inicio')h+='<div class="toolbar"><h2>Inventario global</h2><button class="mini" onclick="go(\'Inventario\')">Ver detalle ›</button></div><div class="grid">'+L.map(l=>'<div class="card">'+l+'<b class="num">'+q(l)+'</b><small>botellas</small></div>').join('')+'</div><div class="toolbar"><h2>Nuestras variedades</h2><button class="mini" onclick="go(\'Productos\')">Ver productos ›</button></div>'+P.map((p,i)=>'<div class="prod" style="--c:'+p[1]+'"><div class="details"><b>'+p[0]+'</b><p>'+L.reduce((a,l)=>a+q(l,i),0)+' botellas · '+(i===2?'700':'720')+' ml</p></div><span style="font-size:25px;color:'+p[1]+'">◈</span></div>').join('')+'<p class="note">Prototipo: datos almacenados únicamente en este teléfono y navegador.</p><div class="card"><h2>Acciones rápidas</h2><button onclick="go(\'Movimientos\')">+ Registrar inventario</button> <button onclick="go(\'Productos\')">Editar costos</button> <button onclick="go(\'CRM\')">+ Prospecto</button></div>';if(page==='Productos')h+='<p class="muted">Toca Editar costo para modificar cada producto.</p>'+P.map((p,i)=>'<div class="prod" style="--c:'+p[1]+'"><div class="details"><b>'+p[0]+'</b><p>Presentación '+(i===2?'700':'720')+' ml · Costo directo: '+money(D.costs[i])+'</p><button onclick="cost('+i+')">Editar costo</button></div><span style="font-size:25px;color:'+p[1]+'">◈</span></div>').join('')+'<div id="edit"></div>';if(page==='Inventario')h+='<div class="tabs">'+L.map(l=>'<button onclick="selectWarehouse(\''+l+'\')">'+l+'</button>').join('')+'</div><div class="grid">'+['Total','Nacional','Exportación','Sin etiquetar'].map(t=>'<div class="card">'+t+'<b class="num">'+q(loc,undefined,t==='Total'?null:t)+'</b></div>').join('')+'</div>'+P.map((p,i)=>'<div class="prod" style="--c:'+p[1]+'"><div class="details"><b>'+p[0]+'</b><p>'+q(loc,i)+' botellas<br>Nacional: '+q(loc,i,'Nacional')+' · Exportación: '+q(loc,i,'Exportación')+'</p></div></div>').join('');if(page==='Movimientos')h+='<p class="muted">Cada movimiento se registra por lote, bodega y etiqueta.</p><div class="card"><h2>Crear lote</h2><label>Código</label><input id="lot" placeholder="EB-2026-001"><label>Variedad</label><select id="lp">'+opts(P.map(p=>p[0]))+'</select><button onclick="addLot()">Guardar lote</button></div><div class="card"><h2>Movimiento</h2><label>Lote</label><select id="ml">'+opts(D.lots.map(x=>x.id))+'</select><label>Ubicación</label><select id="where">'+opts(L)+'</select><label>Etiqueta</label><select id="tag">'+opts(['Nacional','Exportación','Sin etiquetar'])+'</select><label>Tipo</label><select id="kind">'+opts(['Entrada','Salida'])+'</select><label>Botellas</label><input id="count" type="number" min="1"><button onclick="move()">Guardar movimiento</button></div><div class="card"><h2>Transferir entre bodegas</h2><label>Lote</label><select id="transferLot">'+opts(D.lots.map(x=>x.id))+'</select><label>Origen</label><select id="transferFrom">'+opts(L)+'</select><label>Destino</label><select id="transferTo">'+opts(L)+'</select><label>Etiqueta</label><select id="transferTag">'+opts(['Nacional','Exportación','Sin etiquetar'])+'</select><label>Botellas</label><input id="transferCount" type="number" min="1"><button onclick="transfer()">Confirmar transferencia</button></div>'+D.moves.slice().reverse().slice(0,15).map(x=>'<div class="card">'+x.l+' · '+P[x.p][0]+' · '+x.t+'<b class="num">'+x.n+'</b></div>').join('');if(page==='Precios')h+='<p class="muted">Simulador preliminar de márgenes; impuestos y logística pendientes de validación.</p><div class="card">'+['Costo base MXN','Margen EB %','Importador %','Distribuidor %','Retail %'].map((s,i)=>'<label>'+s+'</label><input id="price'+i+'" type="number" value="'+[250,30,25,25,30][i]+'">').join('')+'<button onclick="price()">Calcular</button><div id="priceResult"></div></div>';if(page==='Gastos')h+='<div class="card"><h2>Nuevo gasto</h2><label>Concepto</label><select id="expenseType">'+opts(['Transporte','Contador','Bodega Oaxaca','Bodega USA','Bodega Singapur','Representante','Marketing','Otros'])+'</select><label>Importe MXN</label><input id="expenseAmount" type="number" min="0" step="0.01"><label>Mes (AAAA-MM)</label><input id="expenseMonth" type="month"><label>Notas</label><input id="expenseNotes"><button onclick="addExpense()">Guardar gasto</button></div><h2>Gastos capturados</h2>'+(D.expenses||[]).slice().reverse().map(e=>'<div class="card"><b>'+escapeText(e.type)+'</b> · '+money(e.amount)+'<p class="muted">'+escapeText(e.month)+' · '+escapeText(e.notes)+'</p></div>').join('');if(page==='Marketing')h+='<div class="card"><h2>Material de mercadotecnia</h2><label>Material</label><input id="materialName" placeholder="Flyers, exhibidores, copas..."><label>Ubicación</label><select id="materialLocation">'+opts(L)+'</select><label>Cantidad</label><input id="materialQty" type="number" min="1"><button onclick="addMaterial()">Registrar material</button></div><h2>Existencias registradas</h2>'+(D.materials||[]).map(m=>'<div class="card"><b>'+escapeText(m.name)+'</b><p>'+escapeText(m.loc)+' · '+m.qty+' unidades</p></div>').join('');if(page==='Inicio')h+='<div class="section-title"><h2>Acciones rápidas</h2><span class="chip">Control interno</span></div><div class="action-list"><button onclick="go(\'Movimientos\')"><div><strong>＋</strong> Registrar movimiento<small>Entradas, salidas y transferencias</small></div><span class="arrow">›</span></button><button onclick="go(\'Productos\')"><div><strong>✎</strong> Editar costos<small>Por variedad y componente</small></div><span class="arrow">›</span></button><button onclick="go(\'CRM\')"><div><strong>＋</strong> Nuevo prospecto<small>Contactos y seguimiento</small></div><span class="arrow">›</span></button></div>';if(page==='Más')h='<div class="hero"><div class="eyebrow">ENTRE BESOS CONTROL</div><h1>Más herramientas</h1><div class="sub">Administración y operación comercial</div></div><div class="quick">'+['Precios','CRM','Gastos','Marketing'].map(x=>'<button onclick="go(\''+x+'\')"><span>✦</span>'+x+'</button>').join('')+'</div><div class="card"><h2>Respaldo de datos</h2><p class="muted">Guarda una copia de los registros de este navegador.</p><button onclick="downloadBackup()">Exportar JSON</button></div>';if(page==='CRM')h+='<div class="card">'+['Establecimiento','Contacto','Teléfono o correo','Zona','Próxima acción'].map((s,i)=>'<label>'+s+'</label><input id="c'+i+'" placeholder="'+s+'">').join('')+'<button onclick="contact()">Guardar prospecto</button></div><h2>Contactos</h2>'+D.contacts.map(c=>'<div class="card"><b>'+escapeText(c[0])+'</b><p>'+escapeText(c[3])+' · '+escapeText(c[4])+'</p></div>').join('');el('app').innerHTML=h}function addExpense(){let amount=Number(el('expenseAmount').value);if(!(amount>0))return alert('Captura un importe positivo');D.expenses=D.expenses||[];D.expenses.push({type:el('expenseType').value,amount,month:el('expenseMonth').value,notes:el('expenseNotes').value});save();render()}function addMaterial(){let name=el('materialName').value.trim(),qty=Number(el('materialQty').value);if(!name||!Number.isInteger(qty)||qty<=0)return alert('Revisa material y cantidad');D.materials=D.materials||[];D.materials.push({name,qty,loc:el('materialLocation').value});save();render()}function transfer(){let lot=D.lots.find(x=>x.id===el('transferLot').value),from=el('transferFrom').value,to=el('transferTo').value,t=el('transferTag').value,n=Number(el('transferCount').value);if(!lot||from===to||!Number.isInteger(n)||n<=0)return alert('Revisa lote, ubicaciones y cantidad');let available=D.moves.filter(x=>x.l===from&&x.p===lot.p&&x.t===t&&x.lot===lot.id).reduce((a,x)=>a+x.n,0);if(available<n)return alert('No hay suficientes botellas de este lote y etiqueta');D.moves.push({l:from,p:lot.p,t,n:-n,lot:lot.id,operation:'Transferencia',destination:to});D.moves.push({l:to,p:lot.p,t,n,lot:lot.id,operation:'Transferencia',origin:from});save();render();alert('Transferencia registrada en ambas ubicaciones')}function importBackup(input){let f=input.files&&input.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(!obj||!Array.isArray(obj.lots)||!Array.isArray(obj.moves)||!Array.isArray(obj.contacts)||typeof obj.costs!=='object'||!Array.isArray(obj.moves)||!obj.moves.every(m=>L.includes(m.l)&&Number.isInteger(m.p)&&m.p>=0&&m.p<P.length&&Number.isInteger(m.n)&&typeof m.lot==='string'))throw Error('Formato no compatible');if(!confirm('Esto reemplazará los registros de este navegador. ¿Continuar?'))return;D=obj;save();render();alert('Respaldo importado')}catch(e){alert('No se pudo importar: '+e.message)}};reader.readAsText(f)}function downloadBackup(){let a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(D,null,2));a.download='entre-besos-respaldo.json';a.click()}function escapeText(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function addLot(){let id=el('lot').value.trim();if(!id||D.lots.some(x=>x.id===id))return alert('Código vacío o duplicado');D.lots.push({id,p:P.findIndex(p=>p[0]===el('lp').value)});save();render()}function move(){let lot=D.lots.find(x=>x.id===el('ml').value),n=Number(el('count').value),l=el('where').value,t=el('tag').value;if(!lot||!Number.isInteger(n)||n<=0)return alert('Revisa lote y cantidad');if(el('kind').value==='Salida'){let available=D.moves.filter(x=>x.l===l&&x.p===lot.p&&x.t===t&&x.lot===lot.id).reduce((a,x)=>a+x.n,0);if(available<n)return alert('Inventario insuficiente para este lote y etiqueta');n=-n}D.moves.push({l,p:lot.p,t,n,lot:lot.id});save();render()}function cost(i){let d=D.breakdown?.[i]||{};let fields=['Líquido por litro','Presentación (ml)','Botella','Corcho','Etiqueta','Corrugado por caja','Botellas por caja','Termoencogible','Marbete','Precintos'];el('edit').innerHTML='<div class="card"><h2>Editar '+P[i][0]+'</h2>'+fields.map((f,j)=>'<label>'+f+'</label><input type="number" min="0" step="0.01" id="part'+j+'" value="'+(d[j]??([0,i===2?700:720,0,0,0,0,6,0,0,0][j]))+'">').join('')+'<button onclick="saveCost('+i+')">Guardar desglose</button></div>';el('edit').scrollIntoView({behavior:'smooth',block:'start'})}function saveCost(i){let v=Array.from({length:10},(_,j)=>Number(el('part'+j).value)||0);if(!v[1]||!v[6])return alert('Revisa presentación y botellas por caja');D.breakdown=D.breakdown||{};D.breakdown[i]=v;D.costs[i]=v[0]*v[1]/1000+v[2]+v[3]+v[4]+v[5]/v[6]+v[7]+v[8]+v[9];save();render();alert('Costos guardados')}function price(){let n=Number(el('price0').value);for(let i=1;i<5;i++){let m=Number(el('price'+i).value);if(m<0||m>=100)return alert('Margen inválido');n/=1-m/100}el('priceResult').innerHTML='<h2>Precio ilustrativo: '+money(n)+'</h2>'}function contact(){let c=Array.from({length:5},(_,i)=>el('c'+i).value);if(!c[0])return alert('Captura establecimiento');D.contacts.push(c);save();render()}try{render()}catch(e){document.getElementById('app').innerHTML='<h2>Error de carga</h2><p>'+String(e.message)+'</p>';console.error(e)}
</script></html>
