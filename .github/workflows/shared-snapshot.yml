name: Shared-data development snapshot
on:
  push:
    branches: [work/shared-data]
    paths: ['.github/workflows/shared-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip HEAD -o /tmp/eb-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: eb-source
          path: /tmp/eb-source.zip
          retention-days: 1
