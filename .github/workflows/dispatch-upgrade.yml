name: Build and test recipient-aware dispatch
on:
  push:
    branches: [work/dispatch-destinations-34]
    paths: ['.maintenance/**', '.github/workflows/dispatch-upgrade.yml', 'tests/dispatch.cjs', 'tests/browser-dispatch.py']
permissions:
  contents: write
concurrency:
  group: dispatch-upgrade-34
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/dispatch-destinations-34
      - name: Apply source changes to the isolated branch
        run: |
          python3 .maintenance/dispatch-core.py
          python3 .maintenance/dispatch-ui.py
          node --check inventory-core.js
          node --check lot-operations.js
          node tests/costing.cjs
          node tests/inventory.cjs
          node tests/dispatch.cjs
      - name: Prepare isolated browser tests
        run: |
          python3 -m pip install playwright==1.56.0
          if ! command -v google-chrome && ! command -v chromium; then python3 -m playwright install --with-deps chromium; fi
          python3 tests/serve.py >/tmp/eb-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
      - name: Verify original flows and recipient-aware dispatch
        env:
          EB_TEST_URL: http://127.0.0.1:8765/
          EB_SCREENSHOTS: /tmp/eb-dispatch-screens
        run: |
          python3 tests/browser-inventory.py
          python3 tests/browser-dispatch.py
      - name: Commit only tested app changes to development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inventory-core.js lot-operations.js lot-operations.css control.html tests/browser-inventory.py Dockerfile
          git commit -m 'Implement verified box dispatch to warehouses distributors and clients with ownership-aware delivery'
          git push origin HEAD:work/dispatch-destinations-34
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dispatch-tests-and-source
          path: /tmp/eb-dispatch-screens
          retention-days: 2
