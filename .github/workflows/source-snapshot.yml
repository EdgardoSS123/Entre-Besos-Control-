name: Source snapshot for isolated development
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked app files only
        run: git archive --format=zip HEAD -o /tmp/entre-besos-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: entre-besos-source
          path: /tmp/entre-besos-source.zip
          retention-days: 1
          if-no-files-found: error
