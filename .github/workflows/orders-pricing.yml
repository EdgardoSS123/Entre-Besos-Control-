name: Verify order prices discounts and totals
on:
  push:
    branches: [main, feature/order-pricing-20261117]
    paths: ['orders-core.js', 'orders-ui.js', 'orders.css', 'orders.html', 'corrections-core.js', 'corrections-ui.js', 'simple-lot.js', 'tests/orders-pricing.cjs', 'tests/pricing-corrections.cjs', 'tests/browser-orders-pricing.py', '.github/workflows/orders-pricing.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.56.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify amounts inventory and permissions
        run: |
          mkdir -p /tmp/eb-pricing-review
          for f in orders-core.js orders-ui.js corrections-core.js corrections-ui.js simple-lot.js; do node --check "$f"; done
          for f in tests/*.cjs; do node --experimental-sqlite "$f" || exit; done | tee /tmp/eb-pricing-review/unit.log
      - name: Prepare browser runtime
        if: github.ref != 'refs/heads/main'
        run: |
          sh .github/scripts/build-pdf.sh
          python3 -m pip install playwright==1.56.0
      - name: Verify pricing discounts shared saves and delivery
        if: github.ref != 'refs/heads/main'
        env:
          EB_PRICING_REVIEW: /tmp/eb-pricing-review
          EB_LINKED_REVIEW: /tmp/eb-pricing-review
        run: |
          EB_BROWSER=chromium python3 tests/browser-orders-pricing.py 2>&1 | tee /tmp/eb-pricing-review/chromium-pricing.log
          EB_BROWSER=webkit python3 tests/browser-orders-pricing.py 2>&1 | tee /tmp/eb-pricing-review/webkit-pricing.log
          EB_BROWSER=chromium python3 tests/browser-order-linked-sales.py 2>&1 | tee /tmp/eb-pricing-review/chromium-linked-sales.log
      - name: Verify published pricing and access protection
        if: github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PYVERIFY'
          import time,urllib.request,urllib.error
          from pathlib import Path
          base='https://entre-besos-web-production.up.railway.app/'
          paths=['orders-core.js','orders-ui.js','orders.css','orders.html','corrections-core.js','corrections-ui.js','simple-lot.js']
          for attempt in range(45):
              try:
                  for p in paths: assert urllib.request.urlopen(base+p+'?verify='+str(time.time_ns()),timeout=15).read()==Path(p).read_bytes(),p
                  break
              except Exception:
                  if attempt==44: raise
                  time.sleep(4)
          try: urllib.request.urlopen(base+'api/state',timeout=15); raise AssertionError('Unexpected public data')
          except urllib.error.HTTPError as e: assert e.code==401
          print('PASS exact deployed pricing source and protected shared data. No live records modified by tests.')
          PYVERIFY
      - name: Package review evidence
        if: always()
        run: |
          mkdir -p /tmp/eb-pricing-review
          tar --exclude='.git' --exclude='pdf-deps/node_modules' -czf /tmp/eb-pricing-review/tested-source.tgz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order-pricing-review
          path: /tmp/eb-pricing-review
          retention-days: 5
