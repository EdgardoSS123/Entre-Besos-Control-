name: Verify origin warehouse and stock deductions
on:
  push:
    branches: [work/origin-stock-fix]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Archive current source for isolated work
        run: git archive --format=zip HEAD -o /tmp/eb-stock-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: origin-stock-source
          path: /tmp/eb-stock-source.zip
          retention-days: 1
