name: Verify origin warehouse
on:
  push:
    branches: [work/origin-warehouse]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source for isolated development
        run: git archive --format=zip HEAD -o /tmp/eb-origin-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: origin-source
          path: /tmp/eb-origin-source.zip
          retention-days: 1
